name: build-geode-mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [Win64, Android64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 6.0.0-beta.2
          target: ${{ matrix.target }}
          build: true
          publish: false
          combine: true
