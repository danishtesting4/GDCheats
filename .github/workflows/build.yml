name: build-geode-mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [win, android64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-beta.2
          platform: ${{ matrix.platform }}
          build: true
          publish: false
