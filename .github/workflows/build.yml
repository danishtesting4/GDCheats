name: build-geode-mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            os: windows-latest
          - target: Android64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 6.0.0-beta.2
          target: ${{ matrix.target }}
          build: true
          publish: false
          combine: true
